<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Busayo🤍</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<audio id="birthdayMusic" src="music/BrunoMars.mp3"></audio>


<!-- GLOBAL PAGE CONTAINER -->

<main id="website">


<!-- LOADING PAGE -->

<section class="page active" id="loadingPage">

    <div class="loading-content">

        <div class="gold-heart">
            ♡
        </div>


        <h2>
            Preparing something special...
        </h2>


        <div class="loading-bar">

            <div class="loading-progress"></div>

        </div>


    </div>

</section>





<!-- COUNTDOWN PAGE -->

<section class="page" id="countdownPage">


    <div class="countdown-container">


        <h1 id="countNumber">
            3
        </h1>


    </div>


</section>





<!-- HAPPY BIRTHDAY REVEAL -->

<section class="page" id="birthdayPage">


<div class="birthday-animation">


    <div class="balloons">
        🎈 🎈 🎈
    </div>


    <div class="confetti">

    </div>



    <h1>

        HAPPY BIRTHDAY

        <br>

        BUSAYO

    </h1>



    <div class="sparkles">

        ✨ ✨ ✨

    </div>



</div>


</section>







<!-- COVER PAGE -->

<section class="page" id="coverPage">


<div class="luxury-cover">


<img src="images/cover.jpg"
alt="Busayo Cover">


<div class="gold-frame">


<h2>

To Busayo,

<br>

With Love 🤍

</h2>



<p>

I made something for you...

<br>

I hope it makes you smile.

</p>


</div>


</div>


</section>








<!-- PASSWORD PAGE -->

<section class="page" id="passwordPage">


<div class="password-wrapper">



<!-- COVER IMAGE BESIDE CARD -->

<div class="password-image">


<img src="images/cover.jpg"
alt="Busayo">


</div>






<!-- PASSWORD CARD -->


<div class="password-card">


<div class="lock-icon">

🔐

</div>



<h2>

Every beautiful surprise deserves a little secret.

</h2>



<p class="hint">

Hint:

<br>

"what's my birth month"

</p>



<input

type="password"

id="passwordInput"

placeholder="Enter password"

>



<button onclick="checkPassword()">

Unlock

</button>



<p id="passwordMessage">

</p>



</div>


</div>


</section>





<!-- TREASURE CHEST PAGE -->


<section class="page" id="treasurePage">


<div class="treasure-container">


<div id="treasureChest"
onclick="openChest()">


<div class="chest">

🧰

</div>


<div class="gold-lock">

🔒

</div>


</div>



<h2 id="treasureMessage">

Every treasure tells a story...

</h2>


</div>


</section>
