<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>To Busayo, With Love ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="loading-screen">

<div class="loader"></div>

<h2>Preparing something beautiful...</h2>

</div>

<div id="password-screen">

<div class="password-box">

<h1>To Busayo, With Love 🤍</h1>

<p>Enter the password to begin.</p>

<input
type="password"
id="password"
placeholder="Password">

<p class="hint">
Hint:
What's my birth month?
</p>

<button onclick="checkPassword()">
Enter
</button>

<p id="error"></p>

</div>

</div>

<div id="website">

<nav>

<h2>Busayo ✨</h2>

<ul>

<li><a href="#hero">Home</a></li>

<li><a href="#gallery">Gallery</a></li>

<li><a href="#timeline">Timeline</a></li>

<li><a href="#letter">Letter</a></li>

<li><a href="#special">Special</a></li>

</ul>

</nav>

<section
id="hero"
class="hero">

<h1>
Happy Birthday Busayo
🤍
</h1>

<p>

A little corner of the internet made just for you.

</p>

<button onclick="playMusic()">

Play Music 🎵

</button>

</section>

<audio
id="music"
loop>

<source
src="music.mp3"
type="audio/mpeg">

</audio>

<script src="script.js"></script>

</body>

</html>
